model:
  name: "image_quality"
  architecture: "efficientnet_b0"
  pretrained: true
  freeze_backbone: true
  num_classes: 1
  input_channels: 3
  dropout: 0.3
  task: "regression"

dataset:
  name: "durian_image_quality"
  root: "dataset"
  train_split: "Train"
  val_split: "Validation"
  test_split: "Test"
  target_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  num_workers: 4
  pin_memory: true
  quality_labels:
    - "blur"
    - "overexposed"
    - "underexposed"
    - "low_contrast"
    - "good"

preprocessing:
  resize: [224, 224]
  normalize: true
  to_tensor: true

augmentation:
  train:
    RandomHorizontalFlip:
      p: 0.3
    RandomRotation:
      degrees: 15
    ColorJitter:
      brightness: 0.1
      contrast: 0.1
  val:
    - Resize: [224, 224]
    - CenterCrop: [224, 224]
    - ToTensor
    - Normalize

training:
  epochs: 30
  batch_size: 32
  accumulation_steps: 1
  gradient_clip: 1.0
  mixed_precision: "fp16"
  resume_from: null
  seed: 42

optimizer:
  name: "AdamW"
  params:
    lr: 0.0001
    weight_decay: 0.01

scheduler:
  name: "CosineAnnealingLR"
  params:
    T_max: 30
    eta_min: 1.0e-6
  warmup_epochs: 3

loss:
  name: "MSELoss"
  params: {}

metrics:
  - accuracy
  - precision
  - recall
  - f1_score
  - confusion_matrix

callbacks:
  - name: "ModelCheckpoint"
    params:
      monitor: "val_accuracy"
      mode: "max"
      save_best_only: true
  - name: "EarlyStopping"
    params:
      monitor: "val_accuracy"
      patience: 10
  - name: "TensorBoard"
    params:
      log_dir: "training/tensorboard/model2"
  - name: "CSVLogger"
    params:
      filename: "training/logs/model2_training_log.csv"

logging:
  level: "INFO"
  file: "training/logs/model2.log"

export:
  formats:
    - "pytorch"
    - "onnx"
  output_dir: "training/exports/model2"
  onnx_opset: 17
